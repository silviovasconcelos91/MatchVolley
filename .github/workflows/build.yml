name: Build & Deploy Native Image

on:
  push:
    branches: [master]

jobs:
  # MV-003 : tests unitaires + d'intégration (*IT) en JVM avant tout build/déploiement.
  # Aucun secret : application-test.properties + défauts de application.properties.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_DB: volleymatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d volleymatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run unit and integration tests
        run: ./mvnw test --no-transfer-progress

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-job-reports: 'true'

      - name: Build native image
        run: mvn -Pnative -DskipTests package --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: DockerfileRailway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/volleymatch:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
