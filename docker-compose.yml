services:
  postgres:
    image: postgres:16
    container_name: volleymatch-db
    environment:
      POSTGRES_DB: volleymatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - volleymatch_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    container_name: volleymatch-db-test
    environment:
      POSTGRES_DB: volleymatch_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

volumes:
  volleymatch_data:
